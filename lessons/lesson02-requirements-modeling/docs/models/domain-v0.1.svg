<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <style>text{font-family:"Microsoft YaHei",sans-serif;fill:#172b3a}.title{font-size:31px;font-weight:700}.name{font-size:24px;font-weight:700;fill:#fff}.attr{font-size:20px}.small{font-size:18px;fill:#5b1875}.box{fill:#fff;stroke:#6b58c7;stroke-width:2}.head{fill:#59449b}.line{stroke:#5b1875;stroke-width:2}</style>
  <text class="title" x="600" y="48" text-anchor="middle">选课领域类图 v0.1</text>
  <rect class="box" x="70" y="155" width="270" height="190"/><rect class="head" x="70" y="155" width="270" height="55"/><text class="name" x="205" y="190" text-anchor="middle">Student</text><text class="attr" x="95" y="248">studentId: String</text><text class="attr" x="95" y="287">status: StudentStatus</text>
  <rect class="box" x="465" y="130" width="285" height="240"/><rect class="head" x="465" y="130" width="285" height="55"/><text class="name" x="608" y="165" text-anchor="middle">Enrollment</text><text class="attr" x="490" y="225">enrollmentId: String</text><text class="attr" x="490" y="264">studentId: String</text><text class="attr" x="490" y="303">courseId: String</text><text class="attr" x="490" y="342">createdAt: DateTime</text>
  <rect class="box" x="875" y="105" width="275" height="290"/><rect class="head" x="875" y="105" width="275" height="55"/><text class="name" x="1013" y="140" text-anchor="middle">Course</text><text class="attr" x="900" y="200">courseId: String</text><text class="attr" x="900" y="239">name: String</text><text class="attr" x="900" y="278">open: boolean</text><text class="attr" x="900" y="317">capacity: int</text><text class="attr" x="900" y="356">enrolledCount: int</text>
  <path class="line" d="M340 250 H465 M750 250 H875"/><text class="small" x="350" y="235">1</text><text class="small" x="420" y="235">0..*</text><text class="small" x="760" y="235">0..*</text><text class="small" x="850" y="235">1</text><text class="small" x="380" y="280">拥有</text><text class="small" x="800" y="280">被选择</text>
  <rect x="170" y="470" width="860" height="105" rx="12" fill="#fbf7ee" stroke="#b17818"/><text class="attr" x="600" y="512" text-anchor="middle">每条 Enrollment 只关联一名学生和一门课程</text><text class="small" x="600" y="548" text-anchor="middle">v0.2：引入 CourseOffering，开放状态、容量和已选人数迁移到教学班</text>
</svg>
